[project]
name = "archivist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xiao Ma", email = "francheutsia@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
archivist = "archivist:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
