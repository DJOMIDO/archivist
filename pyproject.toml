[project]
name = "archivist"
version = "0.1.0"
description = "Personal document Q&A assistant built on RAG with LangChain and LangGraph"
readme = "README.md"
authors = [
    { name = "Xiao Ma", email = "francheutsia@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.27.0",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
]

[project.scripts]
archivist = "archivist.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
